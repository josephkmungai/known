<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyberJay | Joseph Kung'u</title>
<style>
:root{--bg:#0b0f14;--card:#121820;--line:#1f2a37;--tx:#e6edf3;--mut:#8b98a7;--ac:#00ff9c;--onac:#04110b;--bub:#1f2a37}
@media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--card:#fff;--line:#d8dee4;--tx:#1f2328;--mut:#59636e;--ac:#0a7d4f;--onac:#fff;--bub:#e7ecf0}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}

/* ---------- USERNAME GATE (first step) ---------- */
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.gbox{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:32px 28px;text-align:center}
.gbox .logo{font-size:22px}
.gbox h1{font-size:22px;margin:16px 0 6px;font-weight:600}
.gbox p{margin:0 0 20px;color:var(--mut);font-size:14px}
.gbox input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:15px;margin-bottom:12px}
.gbox button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--ac);color:var(--onac);font-weight:600;font-size:15px;cursor:pointer}
#gerr{display:block;min-height:18px;margin-top:10px;font-size:13px;color:#ff7b7b}

/* ---------- SITE ---------- */
#site{display:none}
nav{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 5vw;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;color:var(--ac)}
.links{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.links a{font-size:14px;color:var(--mut)}.links a:hover{color:var(--ac)}
.user{display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 6px 4px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card)}
.user #uname{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user button{border:0;background:transparent;color:var(--ac);font-size:13px;font-weight:600;cursor:pointer;padding:4px 8px;font-family:inherit}
section{max-width:960px;margin:0 auto;padding:64px 5vw}
section h1{font-size:clamp(32px,6vw,52px);line-height:1.1;margin:0 0 16px;font-weight:600}
h2{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);font-family:ui-monospace,Menlo,monospace;margin:0 0 24px;font-weight:500}
.hero p{max-width:560px;color:var(--mut);font-size:18px}
.mono{font-family:ui-monospace,Menlo,monospace;color:var(--ac);font-size:14px;margin:0 0 12px}
.btn{display:inline-block;margin:20px 12px 0 0;padding:11px 20px;border-radius:8px;border:1px solid var(--ac);font-weight:500;font-size:15px}
.btn.p{background:var(--ac);color:var(--onac)}.btn.s{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.card h3{margin:0 0 6px;font-size:17px;font-weight:600}.card p{margin:0;color:var(--mut);font-size:14px}
.tag{display:inline-block;margin-top:12px;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:99px;color:var(--mut)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:32px 5vw;border-top:1px solid var(--line)}

/* ---------- CHAT ---------- */
.box{max-width:480px;height:440px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.box header{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;color:var(--ac)}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 12px;border-radius:10px;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:var(--ac);color:var(--onac)}.them{align-self:flex-start;background:var(--bub)}
.bar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.bar input{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:14px;min-width:0}
